services:
  - name: web
    dockerfile: Dockerfile
    env:
      - key: DJANGO_SETTINGS_MODULE
        value: "joblink.settings"
    automatic_scaling:
      target_cpu_utilization: 0.65
    health_check:
      http_path: "/"
      http_port: 8000
      http_method: GET
    env_vars:
      - key: DEBUG
        value: "False"
